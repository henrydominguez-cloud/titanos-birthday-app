name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum
      - name: Go tests
        working-directory: app
        run: go test ./...

      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/birthday-app
