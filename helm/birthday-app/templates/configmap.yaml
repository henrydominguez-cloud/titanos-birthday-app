apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "birthday-app.fullname" . }}
  labels:
    {{- include "birthday-app.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  STORE_BACKEND: {{ .Values.app.storeBackend | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
