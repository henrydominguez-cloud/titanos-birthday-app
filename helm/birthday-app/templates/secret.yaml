{{- /*
Render a Secret holding DATABASE_URL only when the operator has NOT provided an
existing secret. In production you set database.existingSecret and this template
renders nothing, so no credentials ever live in the chart.
*/ -}}
{{- if and (eq .Values.app.storeBackend "postgres") (not .Values.database.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "birthday-app.fullname" . }}-db
  labels:
    {{- include "birthday-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "birthday-app.databaseURL" . | quote }}
{{- end }}
